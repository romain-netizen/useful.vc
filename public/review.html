<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>useful.vc — Secondary review</title>
  <link rel="stylesheet" href="/review.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><p class="eyebrow">useful.vc</p><h1>Secondary review</h1></div>
      <button id="logout" class="ghost" hidden>Lock</button>
    </header>
    <section id="login" class="card login-card">
      <h2>Private review</h2>
      <p>Enter the review credentials configured on Railway.</p>
      <form id="login-form">
        <label>Username<input id="username" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Open review</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="app" hidden>
      <div id="summary" class="stats"></div>
      <div class="toolbar card">
        <input id="search" type="search" placeholder="Search company">
        <select id="filter">
          <option value="disagreements">Disagreements first</option>
          <option value="all">All reviewed</option>
          <option value="fp">False-positive candidates</option>
          <option value="fn">False-negative candidates</option>
          <option value="awaiting">Awaiting adjudication</option>
          <option value="stale">Stale reviews</option>
        </select>
        <button id="refresh" class="ghost">Refresh</button>
      </div>
      <div class="layout">
        <section class="card list-card"><div id="company-list" class="company-list"></div></section>
        <section id="detail" class="card detail-card"><p class="muted">Select a company.</p></section>
      </div>
      <section class="card memory-card">
        <div class="section-head"><div><p class="eyebrow">Learning loop</p><h2>Active engine memory</h2></div><span id="memory-count" class="pill"></span></div>
        <div id="memory-list" class="memory-list"></div>
      </section>
    </section>
  </main>
  <script src="/review.js" defer></script>
</body>
</html>
